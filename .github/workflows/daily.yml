name: Daily UPSC Current Affairs Run

on:
  schedule:
    # 06:00 IST daily (00:30 UTC)
    - cron: "30 0 * * *"
  workflow_dispatch: {}  # allows manual trigger from the Actions tab

jobs:
  run-agent:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to commit the updated seen-articles DB back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: python main.py

      - name: Commit updated seen-articles DB
        run: |
          git config user.name "upsc-agent-bot"
          git config user.email "actions@github.com"
          git add data/articles.db
          git diff --staged --quiet || git commit -m "Update seen-articles DB [automated]"
          git push
